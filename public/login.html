<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Administrator sign in · Relay Mail</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/login.js" defer></script>
</head>
<body>
  <main class="login-shell">
    <form id="login-form" class="panel login-panel" method="post">
      <div class="brand-mark">◯</div>
      <h1>Relay Mail administrator</h1>
      <p class="muted">Private access for this workspace's administrator.</p>
      <label for="password">Dashboard password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <p class="muted">Use your Relay Mail dashboard password. Never enter your Google or Gmail password here.</p>
      <p id="login-error" class="error" role="alert"></p>
      <button class="primary" type="submit">Sign in</button>
      <p class="muted"><a href="/about">About Relay Mail and account safety</a></p>
    </form>
  </main>
</body>
</html>
